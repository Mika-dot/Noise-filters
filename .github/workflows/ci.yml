name: CI

on:
  push:
    branches: [main, feature/advanced-noise-filters, feature/recent-denoising-2026, feature/adaptive-decomposition-2026]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build library
        run: dotnet build Filters/Filters/Filters.csproj --configuration Release
      - name: Run dependency-free tests
        run: dotnet run --project Tests/NoiseFilters.Tests/NoiseFilters.Tests.csproj --configuration Release
      - name: Run adaptive VMD smoke test
        run: dotnet run --project Tests/AdaptiveVmdSmoke/AdaptiveVmdSmoke.csproj --configuration Release
      - name: Run example
        run: dotnet run --project Examples/ConsoleDemo/ConsoleDemo.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install simulation dependencies
        run: pip install -r tools/requirements.txt
      - name: Test reference simulations
        run: python tests/test_benchmarks.py
      - name: Validate chart generators
        run: python -m py_compile tools/generate_benchmarks.py tools/generate_charts.py tools/generate_recent_benchmark.py tools/generate_adaptive_vmd_benchmark.py
      - name: Execute adaptive VMD benchmark
        run: python tools/generate_adaptive_vmd_benchmark.py
